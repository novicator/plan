<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c0392b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plans">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Plans</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0000;
      color: #fff;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .view {
      max-width: 480px;
      margin: 0 auto;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .hidden { display: none !important; }

    /* ── Headers ── */
    .header {
      padding: 24px 24px 14px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fff;
      line-height: 1;
    }

    .sync-indicator {
      font-size: 12px;
      color: #6a2020;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 0.3px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sync-indicator.visible { opacity: 1; }

    .detail-header {
      padding: 28px 24px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 16px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 2px;
      width: fit-content;
    }

    .detail-plan-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
      line-height: 1.2;
      word-break: break-word;
      background: transparent;
      border: none;
      outline: none;
      width: 100%;
      font-family: inherit;
      caret-color: #c0392b;
      -webkit-appearance: none;
      appearance: none;
    }

    /* ── Content ── */
    .content {
      flex: 1;
      padding: 0px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Primary button ── */
    .primary-btn {
      width: 100%;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.2px;
      padding: 14px 24px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(192,57,43,0.5), 0 2px 8px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      flex-shrink: 0;
    }

    .primary-btn:active {
      transform: scale(0.97);
      background: #a93226;
      box-shadow: 0 2px 10px rgba(192,57,43,0.35), 0 1px 4px rgba(0,0,0,0.35);
    }

    @media (hover: hover) {
      .primary-btn:hover {
        background: #cb4335;
        box-shadow: 0 6px 28px rgba(192,57,43,0.6), 0 2px 8px rgba(0,0,0,0.35);
      }
    }

    .small-btn { font-size: 17px; padding: 12px 24px; }

    /* ── Plan list ── */
    .plan-list { display: flex; flex-direction: column; gap: 10px; }

    .plan-item {
      background: #1a0505;
      border: 1px solid #7a2424;
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.12s;
    }

    .plan-item:active { background: #220a0a; }

    .plan-item-name {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }

    .plan-item-meta {
      font-size: 13px;
      color: #c97a7a;
      margin-top: 3px;
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .empty-icon { width: 56px; height: 56px; opacity: 0.12; }

    .empty-text {
      font-size: 15px;
      color: #4a1a1a;
      font-weight: 500;
      text-align: center;
    }

    /* ── Node connector (animated pulse line) ── */
    .node-list { display: flex; flex-direction: column; }

    .node-connector {
      display: flex;
      justify-content: center;
      position: relative;
      height: 40px;
    }

    .node-connector-line {
      width: 3px;
      height: 100%;
      border-radius: 2px;
      background: #2a0606;
      position: relative;
      overflow: hidden;
    }

    .node-connector-line::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 0;
      height: 70%;
      background: linear-gradient(to bottom, transparent 0%, #e74c3c 45%, #ff6b55 50%, #e74c3c 55%, transparent 100%);
      animation: line-flow 2.8s linear infinite;
      filter: blur(0.5px);
    }

    @keyframes line-flow {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(245%); }
    }

    /* ── Node cards ── */
    .node-card {
      background: #160303;
      border: 1px solid #2d0808;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      transition: opacity 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }

    .node-card.dragging { opacity: 0.4; }

    .node-card.drag-over {
      box-shadow: 0 0 0 2px #c0392b, 0 4px 20px rgba(192,57,43,0.4);
    }

    .node-title-row {
      background: #7a1f1f;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .node-drag-handle {
      cursor: grab;
      flex-shrink: 0;
      color: rgba(255,255,255,0.3);
      font-size: 15px;
      line-height: 1;
      padding: 2px 0;
      user-select: none;
      touch-action: none;
    }

    .node-drag-handle:active { cursor: grabbing; }

    .node-title-display {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-title-placeholder { color: rgba(255,255,255,0.35); font-weight: 600; }

    .delete-x {
      background: none;
      border: none;
      color: rgba(255,255,255,0.45);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
      font-size: 20px;
      line-height: 1;
      border-radius: 50%;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .delete-x:hover { color: #fff; background: rgba(255,255,255,0.18); }

    /* floating ghost during drag */
    .drag-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid #e74c3c;
      box-shadow: 0 24px 50px rgba(0,0,0,0.8), 0 0 24px rgba(231,76,60,0.45);
      transform: rotate(1.5deg) scale(1.03);
      background: #2a0808;
    }

    .drag-ghost .node-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #7a1f1f;
      padding: 13px 16px;
    }

    .drag-ghost-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Dialogs (native <dialog>) ── */
    dialog {
      position: fixed;
      inset: 0;
      margin: auto;
      border: none;
      padding: 0;
      background: transparent;
      max-width: calc(100vw - 48px);
    }

    dialog::backdrop { background: rgba(0,0,0,0.65); }

    .modal-sheet {
      background: #1a0505;
      border: 1px solid #2d0808;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-label {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .modal-input {
      width: 100%;
      background: #2a0808;
      border: 1.5px solid #3d1010;
      border-radius: 14px;
      color: #fff;
      font-size: 17px;
      font-family: inherit;
      padding: 15px 16px;
      outline: none;
      caret-color: #c0392b;
      -webkit-appearance: none;
      appearance: none;
    }

    .modal-input:focus { border-color: #c0392b; }
    .modal-input::placeholder { color: #5a2020; }

    .confirm-row { display: flex; gap: 10px; }

    .confirm-row .primary-btn { flex: 1; width: auto; font-size: 16px; padding: 14px 8px; }

    .cancel-btn { background: #3a1010 !important; box-shadow: none !important; }

    /* ── Node detail dialog ── */
    .node-modal {
      background: #160303;
      border: 1px solid #2d0808;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      height: 85dvh;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }

    .node-modal-header {
      background: #7a1f1f;
      padding: 8px 12px 8px 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .node-modal-title-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      font-family: inherit;
      caret-color: #ffaaaa;
      -webkit-appearance: none;
      appearance: none;
    }

    .node-modal-title-input::placeholder { color: rgba(255,255,255,0.3); }

    .node-modal-close {
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      font-size: 22px;
      flex-shrink: 0;
      padding: 6px;
      border-radius: 50%;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .node-modal-close:hover { color: #fff; background: rgba(255,255,255,0.18); }

    .node-modal-desc-input {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ddb0b0;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.6;
      padding: 18px;
      resize: none;
      min-height: 200px;
      caret-color: #fff;
      overflow-y: auto;
      -webkit-appearance: none;
      appearance: none;
    }

    .node-modal-desc-input::placeholder { color: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- ── LIST VIEW ── -->
  <div id="listView" class="view">
    <div class="header">
      <h1>Plans</h1>
      <div class="sync-indicator" id="syncIndicator"></div>
    </div>
    <div class="content">
      <button class="primary-btn" id="newPlanBtn">+ New Plan</button>
      <div class="plan-list" id="planList"></div>
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="4" width="6" height="56" rx="3" fill="white"/>
          <circle cx="9" cy="13" r="3.5" fill="#0f0000"/>
          <circle cx="9" cy="27" r="3.5" fill="#0f0000"/>
          <circle cx="9" cy="41" r="3.5" fill="#0f0000"/>
          <circle cx="9" cy="55" r="3.5" fill="#0f0000"/>
          <rect x="12" y="4" width="46" height="56" rx="5" fill="white"/>
          <line x1="22" y1="21" x2="50" y2="21" stroke="#0f0000" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="22" y1="32" x2="50" y2="32" stroke="#0f0000" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="22" y1="43" x2="38" y2="43" stroke="#0f0000" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <p class="empty-text">No plans yet.<br>Tap + New Plan to get started.</p>
      </div>
    </div>
  </div>

  <!-- ── DETAIL VIEW ── -->
  <div id="detailView" class="view hidden">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">‹ Plans</button>
      <input class="detail-plan-name" id="detailTitle" type="text" maxlength="80" autocomplete="off" autocorrect="off">
    </div>
    <div class="content">
      <button class="primary-btn small-btn" id="addNodeBtn">+ Add Node</button>
      <div class="node-list" id="nodeList"></div>
    </div>
  </div>

  <!-- ── DIALOG: new plan ── -->
  <dialog id="newPlanDialog" class="modal-sheet">
    <div class="modal-label">New Plan</div>
    <input class="modal-input" id="planNameInput" type="text" placeholder="e.g. Cybersecurity job hunt" maxlength="80" autocomplete="off" autocorrect="off" autofocus>
    <button class="primary-btn small-btn" id="createPlanBtn" type="button">Create Plan</button>
  </dialog>

  <!-- ── DIALOG: new node ── -->
  <dialog id="newNodeDialog" class="modal-sheet">
    <div class="modal-label">New Node</div>
    <input class="modal-input" id="nodeNameInput" type="text" placeholder="e.g. Security+ Certificate" maxlength="120" autocomplete="off" autocorrect="off" autofocus>
    <button class="primary-btn small-btn" id="createNodeBtn" type="button">Add Node</button>
  </dialog>

  <!-- ── DIALOG: node detail (title + description) ── -->
  <dialog id="nodeDetailDialog" class="node-modal">
    <div class="node-modal-header">
      <input class="node-modal-title-input" id="nodeDetailTitle" type="text" placeholder="Title" maxlength="120" autocomplete="off" autocorrect="off">
      <button class="node-modal-close" id="nodeDetailCloseBtn" title="Close" type="button">✕</button>
    </div>
    <textarea class="node-modal-desc-input" id="nodeDetailDesc" placeholder="Description..."></textarea>
  </dialog>

  <!-- ── DIALOG: confirm delete (shared by node + plan) ── -->
  <dialog id="confirmDialog" class="modal-sheet">
    <div class="modal-label" id="confirmLabel">Delete this?</div>
    <div class="confirm-row">
      <button class="primary-btn cancel-btn" id="confirmCancelBtn" type="button">Cancel</button>
      <button class="primary-btn" id="confirmOkBtn" type="button">Delete</button>
    </div>
  </dialog>

  <script>
    /* ── Purge any previously installed service worker / cache ──
       This app no longer uses a service worker. If an old one is
       still controlling this page from a prior version, kill it so
       it can never serve stale content again. */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
    if ('caches' in window) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }

    /* ── State ── */
    const SYNC_URL = 'https://jsonblob.com/api/jsonBlob/019ed062-a246-7fed-97ad-ded887e3fd24';
    const STORAGE_KEY = 'plans-data';
    const VIEW_KEY = 'current-plan-id';

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"plans":[]}');
    let currentPlanId = null;
    let dirty = false;
    let syncTimer = null;

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function esc(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      dirty = true;
      clearTimeout(syncTimer);
      setSyncStatus('Syncing…');
      syncTimer = setTimeout(pushToCloud, 700);
    }

    function setSyncStatus(text) {
      const el = document.getElementById('syncIndicator');
      el.textContent = text;
      el.classList.add('visible');
      if (text === 'Synced') setTimeout(() => el.classList.remove('visible'), 1200);
    }

    async function pushToCloud() {
      try {
        await fetch(SYNC_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        dirty = false;
        setSyncStatus('Synced');
      } catch {
        document.getElementById('syncIndicator').classList.remove('visible');
      }
    }

    async function pullFromCloud() {
      try {
        const res = await fetch(SYNC_URL);
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();
        if (data && Array.isArray(data.plans)) {
          state = data;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
      } catch {
        // offline — keep whatever's already in localStorage
      }
    }

    /* ── View elements ── */
    const $listView   = document.getElementById('listView');
    const $detailView = document.getElementById('detailView');
    const $planList    = document.getElementById('planList');
    const $emptyState  = document.getElementById('emptyState');
    const $nodeList     = document.getElementById('nodeList');
    const $detailTitle  = document.getElementById('detailTitle');

    function showList() {
      currentPlanId = null;
      localStorage.removeItem(VIEW_KEY);
      $detailView.classList.add('hidden');
      $listView.classList.remove('hidden');
      renderPlans();
    }

    function showDetail(planId) {
      const plan = state.plans.find(p => p.id === planId);
      if (!plan) { showList(); return; }
      currentPlanId = planId;
      localStorage.setItem(VIEW_KEY, planId);
      $listView.classList.add('hidden');
      $detailView.classList.remove('hidden');
      $detailTitle.value = plan.name;
      renderNodes();
    }

    $detailTitle.addEventListener('input', () => {
      const plan = state.plans.find(p => p.id === currentPlanId);
      if (!plan) return;
      plan.name = $detailTitle.value;
      save();
    });

    document.getElementById('backBtn').addEventListener('click', showList);

    /* ── Render: plan list ── */
    function renderPlans() {
      $planList.innerHTML = '';
      if (state.plans.length === 0) {
        $emptyState.classList.remove('hidden');
        return;
      }
      $emptyState.classList.add('hidden');
      state.plans.forEach(plan => {
        const n = plan.nodes.length;
        const item = document.createElement('div');
        item.className = 'plan-item';
        item.innerHTML = `
          <div>
            <div class="plan-item-name">${esc(plan.name)}</div>
            <div class="plan-item-meta">${n} ${n === 1 ? 'node' : 'nodes'}</div>
          </div>
          <button class="delete-x" title="Delete plan" type="button">✕</button>
        `;
        item.addEventListener('click', e => {
          if (e.target.closest('.delete-x')) return;
          showDetail(plan.id);
        });
        item.querySelector('.delete-x').addEventListener('click', e => {
          e.stopPropagation();
          confirmDelete('Delete this plan?', () => {
            state.plans = state.plans.filter(p => p.id !== plan.id);
            save();
            renderPlans();
          });
        });
        $planList.appendChild(item);
      });
    }

    /* ── Render: node list ── */
    function renderNodes() {
      $nodeList.innerHTML = '';
      const plan = state.plans.find(p => p.id === currentPlanId);
      if (!plan) return;
      plan.nodes.forEach((node, i) => {
        if (i > 0) $nodeList.appendChild(buildConnector(i));
        $nodeList.appendChild(buildNodeCard(node));
      });
    }

    function buildConnector(idx) {
      const el = document.createElement('div');
      el.className = 'node-connector';
      el.innerHTML = `<div class="node-connector-line" style="animation-delay:${((idx - 1) * 0.4) % 2}s"></div>`;
      return el;
    }

    function buildNodeCard(node) {
      const card = document.createElement('div');
      card.className = 'node-card';
      card.dataset.nodeId = node.id;
      const titleHtml = node.title
        ? esc(node.title)
        : '<span class="node-title-placeholder">Untitled</span>';
      card.innerHTML = `
        <div class="node-title-row">
          <span class="node-drag-handle" title="Drag to reorder">⠿</span>
          <span class="node-title-display">${titleHtml}</span>
          <button class="delete-x" title="Delete node" type="button">✕</button>
        </div>
      `;

      card.addEventListener('click', e => {
        if (e.target.closest('.node-drag-handle, .delete-x')) return;
        openNodeDetail(node);
      });

      card.querySelector('.delete-x').addEventListener('click', e => {
        e.stopPropagation();
        confirmDelete('Delete this node?', () => {
          const plan = state.plans.find(p => p.id === currentPlanId);
          if (!plan) return;
          plan.nodes = plan.nodes.filter(n => n.id !== node.id);
          save();
          renderNodes();
        });
      });

      initDrag(card, node);
      return card;
    }

    /* ── Confirm-delete dialog (shared) ── */
    const $confirmDialog = document.getElementById('confirmDialog');
    let confirmAction = null;

    function confirmDelete(label, onConfirm) {
      document.getElementById('confirmLabel').textContent = label;
      confirmAction = onConfirm;
      $confirmDialog.showModal();
    }

    document.getElementById('confirmCancelBtn').addEventListener('click', () => {
      confirmAction = null;
      $confirmDialog.close();
    });

    $confirmDialog.addEventListener('click', e => {
      if (e.target === $confirmDialog) {
        confirmAction = null;
        $confirmDialog.close();
      }
    });

    document.getElementById('confirmOkBtn').addEventListener('click', () => {
      const action = confirmAction;
      confirmAction = null;
      $confirmDialog.close();
      if (action) action();
    });

    /* ── Node detail dialog ── */
    const $nodeDetailDialog = document.getElementById('nodeDetailDialog');
    const $nodeDetailTitle  = document.getElementById('nodeDetailTitle');
    const $nodeDetailDesc   = document.getElementById('nodeDetailDesc');
    let activeNode = null;

    function openNodeDetail(node) {
      activeNode = node;
      $nodeDetailTitle.value = node.title;
      $nodeDetailDesc.value = node.desc;
      $nodeDetailDialog.showModal();
    }

    function closeNodeDetail() {
      $nodeDetailDialog.close();
      activeNode = null;
      renderNodes();
    }

    $nodeDetailTitle.addEventListener('input', () => {
      if (!activeNode) return;
      activeNode.title = $nodeDetailTitle.value;
      save();
    });

    $nodeDetailDesc.addEventListener('input', () => {
      if (!activeNode) return;
      activeNode.desc = $nodeDetailDesc.value;
      save();
    });

    document.getElementById('nodeDetailCloseBtn').addEventListener('click', closeNodeDetail);

    $nodeDetailDialog.addEventListener('click', e => {
      if (e.target === $nodeDetailDialog) closeNodeDetail();
    });

    /* ── New Plan dialog ── */
    const $newPlanDialog  = document.getElementById('newPlanDialog');
    const $planNameInput  = document.getElementById('planNameInput');

    document.getElementById('newPlanBtn').addEventListener('click', () => {
      $planNameInput.value = '';
      $newPlanDialog.showModal();
    });

    $newPlanDialog.addEventListener('click', e => {
      if (e.target === $newPlanDialog) $newPlanDialog.close();
    });

    $planNameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('createPlanBtn').click();
    });

    document.getElementById('createPlanBtn').addEventListener('click', () => {
      const name = $planNameInput.value.trim();
      if (!name) return;
      const plan = { id: uid(), name, nodes: [] };
      state.plans.unshift(plan);
      save();
      $newPlanDialog.close();
      showDetail(plan.id);
    });

    /* ── New Node dialog ── */
    const $newNodeDialog  = document.getElementById('newNodeDialog');
    const $nodeNameInput  = document.getElementById('nodeNameInput');

    document.getElementById('addNodeBtn').addEventListener('click', () => {
      $nodeNameInput.value = '';
      $newNodeDialog.showModal();
    });

    $newNodeDialog.addEventListener('click', e => {
      if (e.target === $newNodeDialog) $newNodeDialog.close();
    });

    $nodeNameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('createNodeBtn').click();
    });

    document.getElementById('createNodeBtn').addEventListener('click', () => {
      const name = $nodeNameInput.value.trim();
      if (!name) return;
      const plan = state.plans.find(p => p.id === currentPlanId);
      if (!plan) return;
      const node = { id: uid(), title: name, desc: '' };
      plan.nodes.push(node);
      save();
      if (plan.nodes.length > 1) $nodeList.appendChild(buildConnector(plan.nodes.length - 1));
      $nodeList.appendChild(buildNodeCard(node));
      $newNodeDialog.close();
    });

    /* ── Drag to reorder nodes ── */
    function initDrag(card, node) {
      const handle = card.querySelector('.node-drag-handle');
      let ghost = null;
      let overCard = null;
      let offsetX = 0, offsetY = 0;

      handle.addEventListener('pointerdown', e => {
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);

        const rect = card.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.style.left = rect.left + 'px';
        ghost.style.top  = rect.top  + 'px';
        ghost.style.width = rect.width + 'px';
        ghost.innerHTML = `
          <div class="node-title-row">
            <span class="node-drag-handle">⠿</span>
            <span class="drag-ghost-title">${esc(node.title || 'Untitled')}</span>
          </div>
        `;
        document.body.appendChild(ghost);
        card.classList.add('dragging');
      });

      handle.addEventListener('pointermove', e => {
        if (!ghost) return;
        ghost.style.left = (e.clientX - offsetX) + 'px';
        ghost.style.top  = (e.clientY - offsetY) + 'px';

        ghost.style.visibility = 'hidden';
        const el = document.elementFromPoint(e.clientX, e.clientY);
        ghost.style.visibility = '';

        const target = el && el.closest('#nodeList .node-card');
        if (overCard && overCard !== target) overCard.classList.remove('drag-over');
        overCard = (target && target !== card) ? target : null;
        if (overCard) overCard.classList.add('drag-over');
      });

      handle.addEventListener('pointerup', () => {
        if (!ghost) return;
        ghost.remove();
        ghost = null;
        card.classList.remove('dragging');
        if (overCard) {
          overCard.classList.remove('drag-over');
          const targetId = overCard.dataset.nodeId;
          overCard = null;
          if (targetId) reorderNodes(node.id, targetId);
        }
      });
    }

    function reorderNodes(srcId, targetId) {
      const plan = state.plans.find(p => p.id === currentPlanId);
      if (!plan) return;
      const srcIdx = plan.nodes.findIndex(n => n.id === srcId);
      const tgtIdx = plan.nodes.findIndex(n => n.id === targetId);
      if (srcIdx === -1 || tgtIdx === -1) return;
      const [moved] = plan.nodes.splice(srcIdx, 1);
      plan.nodes.splice(tgtIdx, 0, moved);
      save();
      renderNodes();
    }

    /* ── Keep things sane across iOS suspend/resume ──
       iOS suspends (rather than reloads) a home-screen PWA when
       backgrounded, so any dialog left open would otherwise still be
       open — stacked over the rest of the UI — when the app resumes. */
    function closeAllDialogs() {
      if ($newPlanDialog.open) $newPlanDialog.close();
      if ($newNodeDialog.open) $newNodeDialog.close();
      if ($nodeDetailDialog.open) { $nodeDetailDialog.close(); activeNode = null; }
      if ($confirmDialog.open) { confirmAction = null; $confirmDialog.close(); }
    }

    function isBusy() {
      const dialogOpen = $newPlanDialog.open || $newNodeDialog.open || $nodeDetailDialog.open || $confirmDialog.open;
      const tag = document.activeElement && document.activeElement.tagName;
      return dialogOpen || tag === 'INPUT' || tag === 'TEXTAREA' || dirty;
    }

    async function refreshFromCloud() {
      if (isBusy()) return;
      await pullFromCloud();
      if (currentPlanId && !$detailView.classList.contains('hidden')) {
        const plan = state.plans.find(p => p.id === currentPlanId);
        if (plan) {
          $detailTitle.value = plan.name;
          renderNodes();
        } else {
          showList();
        }
      } else {
        renderPlans();
      }
    }

    /* ── Init ── */
    closeAllDialogs();

    const savedPlanId = localStorage.getItem(VIEW_KEY);
    if (savedPlanId && state.plans.some(p => p.id === savedPlanId)) {
      showDetail(savedPlanId);
    } else {
      showList();
    }

    refreshFromCloud();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        closeAllDialogs();
        refreshFromCloud();
      }
    });

    setInterval(() => {
      if (document.visibilityState === 'visible') refreshFromCloud();
    }, 15000);
  </script>
</body>
</html>
